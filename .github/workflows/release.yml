name: Release browser packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate release version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); const tag=process.env.TAG_VERSION.replace(/^v/,''); for(const file of ['package.json','manifest.json','manifest.chrome.json','manifest.firefox.json']){const value=JSON.parse(fs.readFileSync(file,'utf8')); if(value.version!==tag){console.error('Tag version '+tag+' does not match '+file+' version '+value.version); process.exit(1);}}"

      - name: Check, test and build
        run: |
          npm run check
          npm test
          npm run build

      - name: Validate packaged icon assets
        run: |
          set -euo pipefail
          for browser in chrome edge firefox; do
            for size in 16 32 48 128 256; do
              test -f "dist/${browser}/src/assets/icon-${size}.png"
            done
            test ! -d "dist/${browser}/imgs"
          done

      - name: Package browser artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          tag="${GITHUB_REF_NAME:-manual}"
          chrome_zip="local-llm-translator-pro-chrome-${tag}.zip"
          edge_zip="local-llm-translator-pro-edge-${tag}.zip"
          firefox_zip="local-llm-translator-pro-firefox-${tag}.zip"
          firefox_xpi="local-llm-translator-pro-firefox-${tag}.xpi"

          (cd dist/chrome && zip -qr "../../release/${chrome_zip}" .)
          (cd dist/edge && zip -qr "../../release/${edge_zip}" .)
          (cd dist/firefox && zip -qr "../../release/${firefox_zip}" .)

          cp "release/${chrome_zip}" "release/local-llm-translator-pro-chrome-${tag}.crx"
          cp "release/${edge_zip}" "release/local-llm-translator-pro-edge-${tag}.crx"
          cp "release/${firefox_zip}" "release/${firefox_xpi}"

          ls -lh release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-translator-pro-${{ github.ref_name }}
          path: release/*

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Local LLM Translator Pro ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*