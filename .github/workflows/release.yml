name: Release browser packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate release version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); const tag=process.env.TAG_VERSION.replace(/^v/,''); for(const file of ['package.json','manifest.json','manifest.chrome.json','manifest.firefox.json']){const value=JSON.parse(fs.readFileSync(file,'utf8')); if(value.version!==tag){console.error('Tag version '+tag+' does not match '+file+' version '+value.version); process.exit(1);}}"

      - name: Check, test and build
        run: |
          npm run check
          npm test
          npm run build

      - name: Package browser artifacts
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p release
          tag="${GITHUB_REF_NAME:-manual}"
          chrome_name="local-llm-translator-chrome-${tag}.zip"
          edge_name="local-llm-translator-edge-${tag}.zip"
          firefox_name="local-llm-translator-firefox-${tag}.xpi"

          (cd dist/chrome && zip -qr "../../release/${chrome_name}" .)
          (cd dist/edge && zip -qr "../../release/${edge_name}" .)
          (cd dist/firefox && zip -qr "../../release/${firefox_name}" .)

          if [ -n "${AMO_JWT_ISSUER:-}" ] && [ -n "${AMO_JWT_SECRET:-}" ]; then
            rm -f "release/${firefox_name}"
            npx --yes web-ext@8 sign \
              --source-dir dist/firefox \
              --artifacts-dir release \
              --channel unlisted \
              --api-key "${AMO_JWT_ISSUER}" \
              --api-secret "${AMO_JWT_SECRET}" \
              --overwrite-dest
            signed_xpi="$(find release -maxdepth 1 -type f -name '*.xpi' | head -n 1)"
            test -n "${signed_xpi}"
            mv "${signed_xpi}" "release/${firefox_name}"
          fi

          key_path="${RUNNER_TEMP}/local-llm-translator-release-key.pem"
          if [ -n "${CRX_PRIVATE_KEY:-}" ]; then
            printf '%s' "${CRX_PRIVATE_KEY}" > "${key_path}"
          else
            echo "::warning::CRX_PRIVATE_KEY is not configured; using an ephemeral release key. Extension ID will change between releases."
            openssl genrsa -out "${key_path}" 2048
          fi
          chrome_bin="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -n "${chrome_bin}" ]; then
            for browser in chrome edge; do
              rm -f "dist/${browser}.crx"
              "${chrome_bin}" --no-sandbox --disable-gpu --pack-extension="${PWD}/dist/${browser}" --pack-extension-key="${key_path}" >/dev/null 2>&1 || true
              if [ -f "dist/${browser}.crx" ]; then
                mv "dist/${browser}.crx" "release/local-llm-translator-${browser}-${tag}.crx"
              else
                echo "::warning::Could not create ${browser} CRX on this runner"
              fi
            done
          else
            echo "::warning::No Chromium binary found; skipping CRX packaging"
          fi

          ls -lh release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-translator-${{ github.ref_name }}
          path: release/*

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Local LLM Translator ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
